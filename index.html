<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Nine — Group Photo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #070b14;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    font-size: 48px;
    margin: 0;
    font-weight: 900;
    letter-spacing: -2px;
}

header p {
    color: #9da8bd;
}

.panel {
    background: #101624;
    border: 1px solid #273249;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 20px;
}

select,
input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 12px;
    border: 1px solid #34405a;
    background: #080d18;
    color: white;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #080b14;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    transform: translateY(-1px);
}

/* FINAL GROUP PHOTO */

.group-photo {
    background:
        radial-gradient(circle at top, #263b72, #0b101c 55%);
    border-radius: 25px;
    padding: 25px;
    position: relative;
    overflow: hidden;
}

.group-title {
    text-align: center;
    margin-bottom: 20px;
}

.group-title h2 {
    font-size: 35px;
    margin: 0;
}

.group-title p {
    color: #aeb9ce;
}

/* LEADER */

.leader-slot {
    width: 180px;
    height: 180px;
    margin: auto;
    border-radius: 50%;
    border: 5px solid white;
    overflow: hidden;
    background: #151d2e;
    position: relative;
}

.leader-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.leader-name {
    text-align: center;
    margin: 10px 0 20px;
    font-weight: bold;
}

/* MEMBERS */

.members-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.member-card {
    background: #121a29;
    border-radius: 15px;
    padding: 8px;
    text-align: center;
    border: 1px solid #2c3850;
}

.member-photo {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 11px;
    overflow: hidden;
    background: #080d18;
}

.member-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.member-name {
    font-size: 12px;
    margin-top: 8px;
    color: #c8d0df;
}

.empty {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    color: #56627a;
    font-size: 12px;
}

.status {
    text-align: center;
    color: #9da8bd;
    margin-top: 10px;
    min-height: 20px;
}

@media(max-width:600px) {

    header h1 {
        font-size: 40px;
    }

    .members-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .leader-slot {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>OUR NINE</h1>
    <p>One group. Nine people. One memory.</p>
</header>

<div class="panel">

    <h2>Upload Your Photo</h2>

    <select id="memberSelect">
        <option value="Leader">👑 Leader</option>
        <option value="Member 1">Member 1</option>
        <option value="Member 2">Member 2</option>
        <option value="Member 3">Member 3</option>
        <option value="Member 4">Member 4</option>
        <option value="Member 5">Member 5</option>
        <option value="Member 6">Member 6</option>
        <option value="Member 7">Member 7</option>
        <option value="Member 8">Member 8</option>
    </select>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
    >

    <button onclick="uploadPhoto()">
        UPLOAD PHOTO
    </button>

    <div class="status" id="status"></div>

</div>

<div class="panel">

<div class="group-photo" id="groupPhoto">

    <div class="group-title">
        <h2>OUR NINE</h2>
        <p>OUR GROUP • 2026</p>
    </div>

    <!-- LEADER -->

    <div class="leader-slot" id="Leader">
        <div class="empty">
            LEADER
        </div>
    </div>

    <div class="leader-name">
        👑 Leader
    </div>

    <!-- MEMBERS -->

    <div class="members-grid">

        <div class="member-card">
            <div class="member-photo" id="Member1">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 1</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member2">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 2</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member3">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 3</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member4">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 4</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member5">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 5</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member6">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 6</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member7">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 7</div>
        </div>

        <div class="member-card">
            <div class="member-photo" id="Member8">
                <div class="empty">PHOTO</div>
            </div>
            <div class="member-name">Member 8</div>
        </div>

    </div>

</div>

<button onclick="downloadGroupPhoto()">
    📥 DOWNLOAD FINAL GROUP PHOTO
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://llhsfopzgotrdsbavjxy.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaHNmb3B6Z290cmRzYmF2anh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTE0MDksImV4cCI6MjEwMjU2NzQwOX0.KYIgNKRmCU8MCJM07Q4utU021jOGj3V2fpY-Lc3QkEY";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* UPLOAD */

async function uploadPhoto() {

    const member =
        document.getElementById(
            "memberSelect"
        ).value;

    const file =
        document.getElementById(
            "photoInput"
        ).files[0];

    const status =
        document.getElementById(
            "status"
        );

    if (!file) {

        status.innerText =
            "Please select a photo.";

        return;
    }

    status.innerText =
        "Uploading...";

    const extension =
        file.name
        .split(".")
        .pop();

    const fileName =
        crypto.randomUUID()
        + "."
        + extension;

    const path =
        fileName;


    const upload =
        await db.storage
        .from("group-photos")
        .upload(
            path,
            file,
            {
                contentType:
                    file.type
            }
        );


    if (upload.error) {

        status.innerText =
            upload.error.message;

        return;
    }


    const publicURL =
        db.storage
        .from("group-photos")
        .getPublicUrl(path)
        .data.publicUrl;


    const insert =
        await db
        .from("group_photos")
        .insert({

            member_name:
                member,

            member_role:
                member === "Leader"
                ? "Leader"
                : "Member",

            file_path:
                path,

            public_url:
                publicURL

        });


    if (insert.error) {

        status.innerText =
            insert.error.message;

        return;
    }


    status.innerText =
        "Photo uploaded successfully!";

    document.getElementById(
        "photoInput"
    ).value = "";

    loadPhotos();
}


/* LOAD PHOTOS */

async function loadPhotos() {

    const result =
        await db
        .from("group_photos")
        .select("*")
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (result.error) {

        console.log(
            result.error
        );

        return;
    }


    result.data.forEach(photo => {

        let id =
            photo.member_name
            .replace(" ", "");


        const slot =
            document.getElementById(id);


        if (!slot) return;


        slot.innerHTML = "";


        const img =
            document.createElement("img");

        img.src =
            photo.public_url;

        img.alt =
            photo.member_name;


        slot.appendChild(img);

    });

}


/* DOWNLOAD */

async function downloadGroupPhoto() {

    alert(
        "Final image download will be enabled in the next version."
    );

}


loadPhotos();

</script>

</body>
</html>
